nt par contraposée","d":"on prouve « non Q ⇒ non P » pour établir « P ⇒ Q »."},{"s":"Logique et raisonnement","t":"Raisonnement par récurrence","d":"preuve en deux temps, initialisation puis hérédité, pour une propriété portant sur les entiers."},{"s":"Logique et raisonnement","t":"Récurrence forte","d":"récurrence où l'hérédité suppose la propriété vraie pour tous les rangs précédents."},{"s":"Logique et raisonnement","t":"Disjonction de cas","d":"on découpe en cas qui couvrent toutes les possibilités et on traite chacun."},{"s":"Logique et raisonnement","t":"Analyse-synthèse","d":"on cherche d'abord les conditions nécessaires (analyse), puis on vérifie qu'elles suffisent (synthèse)."},{"s":"Logique et raisonnement","t":"Démonstration directe","d":"on part des hypothèses et on enchaîne les déductions jusqu'à la conclusion."},{"s":"Logique et raisonnement","t":"Démonstration constructive","d":"preuve d'existence qui exhibe explicitement l'objet."},{"s":"Logique et raisonnement","t":"Descente infinie","d":"méthode de Fermat : on montre qu'une solution en entraînerait une plus petite, sans fin, ce qui est impossible."},{"s":"Logique et raisonnement","t":"Syllogisme","d":"raisonnement à deux prémisses et une conclusion (tous les hommes sont mortels, Socrate est un homme, donc…)."},{"s":"Logique et raisonnement","t":"Sophisme","d":"raisonnement faux qui a l'apparence de la validité."},{"s":"Logique et raisonnement","t":"Paradoxe","d":"énoncé qui semble contredire le sens commun ou conduit à une contradiction apparente."},{"s":"Logique et raisonnement","t":"Principe du tiers exclu","d":"toute proposition est vraie ou sa négation est vraie."},{"s":"Logique et raisonnement","t":"Principe de non-contradiction","d":"une proposition et sa négation ne peuvent être vraies ensemble."},{"s":"Logique et raisonnement","t":"Axiome du choix","d":"on peut choisir un élément dans chaque ensemble non vide d'une famille quelconque."},{"s":"Logique et raisonnement","t":"Lemme de Zorn","d" ction vide."},{"s":"Ensembles, relations et applications","t":"Produit cartésien","d":"ensemble des couples (a, b) avec a dans A et b dans B."},{"s":"Ensembles, relations et applications","t":"Couple","d":"paire ordonnée de deux éléments."},{"s":"Ensembles, relations et applications","t":"Triplet (n-uplet)","d":"liste ordonnée de trois (n) éléments."},{"s":"Ensembles, relations et applications","t":"Partition","d":"découpage d'un ensemble en parties non vides, deux à deux disjointes, de réunion égale à l'ensemble."},{"s":"Ensembles, relations et applications","t":"Ensemble des parties","d":"ensemble de tous les sous-ensembles d'un ensemble ; il a 2ⁿ éléments si l'ensemble en a n."},{"s":"Ensembles, relations et applications","t":"Cardinal","d":"nombre d'éléments d'un ensemble fini."},{"s":"Ensembles, relations et applications","t":"Famille","d":"collection d'objets indexée par un ensemble d'indices."},{"s":"Ensembles, relations et applications","t":"Intervalle","d":"ensemble des réels compris entre deux bornes."},{"s":"Ensembles, relations et applications","t":"Relation binaire","d":"propriété qui relie ou non deux éléments d'un ensemble."},{"s":"Ensembles, relations et applications","t":"Réflexive","d":"relation où tout élément est en relation avec lui-même."},{"s":"Ensembles, relations et applications","t":"Symétrique","d":"relation où a R b entraîne b R a."},{"s":"Ensembles, relations et applications","t":"Antisymétrique","d":"relation où a R b et b R a entraînent a = b."},{"s":"Ensembles, relations et applications","t":"Transitive","d":"relation où a R b et b R c entraînent a R c."},{"s":"Ensembles, relations et applications","t":"Relation d'équivalence","d":"relation réflexive, symétrique et transitive."},{"s":"Ensembles, relations et applications","t":"Classe d'équivalence","d":"ensemble des éléments en relation avec un élément donné."},{"s":"Ensembles, relations et applications","t":"Ensemble quotient","d":"ensemble des classes d'équivalence."},{"s":"Ensembles, relations et applications","t":"Relation d'ordre","d":"relation réflexive, antisymétrique et transitive."},{"s":"Ensembles, relations et applications","t":"Ordre total","d":"ordre où deux éléments quelconques sont toujours comparables."},{"s":"Ensembles, relations et applications","t":"Ordre partiel","d":"ordre où certains éléments ne sont pas comparables."},{"s":"Ensembles, relations et applications","t":"Majorant (minorant)","d":"élément supérieur (inférieur) ou égal à tous les éléments d'une partie."},{"s":"Ensembles, relations et applications","t":"Borne supérieure","d":"plus petit des majorants."},{"s":"Ensembles, relations et applications","t":"Borne inférieure","d":"plus grand des minorants."},{"s":"Ensembles, relations et applications","t":"Plus grand élément (maximum)","d":"élément de la partie qui majore toute la partie."},{"s":"Ensembles, relations et applications","t":"Élément maximal","d":"élément qu'aucun autre élément de la partie ne dépasse."},{"s":"Ensembles, relations et applications","t":"Application","d":"relation qui associe à chaque élément de l'ensemble de départ exactement un élément d'arrivée."},{"s":"Ensembles, relations et applications","t":"Image directe","d":"ensemble des images des éléments d'une partie."},{"s":"Ensembles, relations et applications","t":"Image réciproque","d":"ensemble des éléments dont l'image appartient à une partie donnée."},{"s":"Ensembles, relations et applications","t":"Restriction","d":"application obtenue en ne considérant qu'une partie de l'ensemble de départ."},{"s":"Ensembles, relations et applications","t":"Prolongement","d":"application définie sur un ensemble plus grand et qui coïncide avec une application donnée."},{"s":"Ensembles, relations et applications","t":"Application identité","d":"application qui envoie chaque élément sur lui-même."},{"s":"Ensembles, relations et applications","t":"Involution","d":"application qui, composée avec elle-même, donne l'identité."},{"s":"Ensembles, relations et applications","t":"Fonction indicatrice (caractéristique)","d":"fonction valant 1 sur une partie et 0 en dehors."},{"s":"Ensembles, relations et applications","t":"Injection","d":"application où deux éléments distincts ont des images distinctes."},{"s":"Ensembles, relations et applications","t":"Surjection","d":"application où tout élément d'arrivée a au moins un antécédent."},{"s":"Ensembles, relations et applications","t":"Bijection","d":"application à la fois injective et surjective."},{"s":"Ensembles, relations et applications","t":"Équipotents","d":"ensembles entre lesquels il existe une bijection."},{"s":"Ensembles, relations et applications","t":"Ensemble dénombrable","d":"ensemble équipotent à l'ensemble des entiers naturels."},{"s":"Ensembles, relations et applications","t":"Ensemble non dénombrable","d":"ensemble infini qui n'est pas dénombrable (les réels)."},{"s":"Ensembles, relations et applications","t":"Diagonale de Cantor","d":"argument qui prouve que les réels ne sont pas dénombrables."},{"s":"Ensembles, relations et applications","t":"Théorème de Cantor","d":"un ensemble a toujours strictement moins d'éléments que l'ensemble de ses parties."},{"s":"Ensembles, relations et applications","t":"Hypothèse du continu","d":"il n'existe aucun cardinal strictement compris entre celui des entiers et celui des réels."},{"s":"Ensembles, relations et applications","t":"Ensemble convexe","d":"ensemble qui contient tout segment joignant deux de ses points."},{"s":"Ensembles, relations et applications","t":"Ensemble borné","d":"ensemble contenu dans une boule de rayon fini."},{"s":"Nombres et arithmétique","t":"Entier naturel (ℕ)","d":"nombre de comptage 0, 1, 2, 3…"},{"s":"Nombres et arithmétique","t":"Entier relatif (ℤ)","d":"entier positif, négatif ou nul."},{"s":"Nombres et arithmétique","t":"Nombre rationnel (ℚ)","d":"nombre qui s'écrit comme quotient de deux entiers."},{"s":"Nombres et arithmétique","t":"Nombre irrationnel","d":"réel qui n'est pas rationnel (√2, Nombre palindrome","d":"nombre qui se lit de la même façon dans les deux sens."},{"s":"Nombres et arithmétique","t":"Nombre de Carmichael","d":"entier composé qui vérifie le petit théorème de Fermat pour toute base première avec lui."},{"s":"Nombres et arithmétique","t":"Nombre d'or (φ)","d":"nombre (1 + √5)/2, environ 1,618."},{"s":"Nombres et arithmétique","t":"Nombre e","d":"base du logarithme népérien, environ 2,718."},{"s":"Nombres et arithmétique","t":"Nombre π","d":"rapport de la circonférence d'un cercle à son diamètre."},{"s":"Nombres et arithmétique","t":"Constante d'Euler (γ)","d":"limite de (1 + 1/2 + … + 1/n − ln n), environ 0,577."},{"s":"Nombres et arithmétique","t":"Nombre i","d":"nombre imaginaire tel que i² = −1."},{"s":"Nombres et arithmétique","t":"Diviseur","d":"entier qui divise exactement un autre, sans reste."},{"s":"Nombres et arithmétique","t":"Multiple","d":"produit d'un entier par un autre entier."},{"s":"Nombres et arithmétique","t":"PGCD","d":"plus grand entier qui divise à la fois deux entiers."},{"s":"Nombres et arithmétique","t":"PPCM","d":"plus petit multiple commun strictement positif de deux entiers."},{"s":"Nombres et arithmétique","t":"Relation PGCD-PPCM","d":"PGCD(a, b) × PPCM(a, b) = a × b."},{"s":"Nombres et arithmétique","t":"Algorithme d'Euclide","d":"méthode de calcul du PGCD par divisions successives."},{"s":"Nombres et arithmétique","t":"Division euclidienne","d":"opération qui donne a = bq + r avec 0 ≤ r < b."},{"s":"Nombres et arithmétique","t":"Dividende / diviseur","d":"nombre que l'on divise / nombre par lequel on divise."},{"s":"Nombres et arithmétique","t":"Quotient","d":"résultat d'une division."},{"s":"Nombres et arithmétique","t":"Reste","d":"ce qui reste après la division euclidienne."},{"s":"Nombres et arithmétique","t":"Congruence","d":"a ≡ b (mod n) quand a et b ont le même reste dans la division par n."},{"s":"Nombres et arithmétique","t":"Modulo","d":"entier n par rapport auquel on compare les restes."},{"s":"Nombres et arithmétique","t":"Théorème de Bézout","d":"a et b sont premiers entre eux si et seulement s'il existe u, v tels que au + bv = 1."},{"s":"Nombres et arithmétique","t":"Lemme de Gauss","d":"si a divise bc et est premier avec b, alors a divise c."},{"s":"Nombres et arithmétique","t":"Lemme d'Euclide","d":"si un nombre premier divise un produit, il divise l'un des facteurs."},{"s":"Nombres et arithmétique","t":"Théorème fondamental de l'arithmétique","d":"tout entier supérieur à 1 s'écrit de façon unique comme produit de nombres premiers."},{"s":"Nombres et arithmétique","t":"Décomposition en facteurs premiers","d":"écriture d'un entier comme produit de nombres premiers."},{"s":"Nombres et arithmétique","t":"Crible d'Ératosthène","d":"méthode qui élimine les multiples pour trouver les nombres premiers."},{"s":"Nombres et arithmétique","t":"Critère de divisibilité","d":"règle pour savoir si un entier est divisible par un autre sans faire la division."},{"s":"Nombres et arithmétique","t":"Petit théorème de Fermat","d":"si p est premier et ne divise pas a, alors a^(p−1) ≡ 1 (mod p)."},{"s":"Nombres et arithmétique","t":"Indicatrice d'Euler (φ)","d":"nombre d'entiers entre 1 et n premiers avec n."},{"s":"Nombres et arithmétique","t":"Théorème d'Euler","d":"si a est premier avec n, alors a^φ(n) ≡ 1 (mod n)."},{"s":"Nombres et arithmétique","t":"Théorème chinois","d":"système de congruences à modules premiers entre eux : il a une solution unique modulo le produit."},{"s":"Nombres et arithmétique","t":"Théorème de Wilson","d":"p est premier si et seulement si (p − 1)! ≡ −1 (mod p)."},{"s":"Nombres et arithmétique","t":"Grand théorème de Fermat","d":"l'équation xⁿ + yⁿ = zⁿ n'a pas de solution entière non nulle pour n > 2 (Wiles, 1994)."},{"s":"Nombres et arithmétique","t":"Conjecture de Goldbach","d":"tout entier pair supérieur à 2 est somme de deux nombres premiers."},{"s":"Nombres et arithmétique","t":"Conjecture de Syracuse","d":"suite : n/2 si n est pair, 3n + 1 sinon ; elle atteindrait toujours 1."},{"s":"Nombres et arithmétique","t":"Hypothèse de Riemann","d":"tous les zéros non triviaux de la fonction zêta ont pour partie réelle 1/2."},{"s":"Nombres et arithmétique","t":"Théorème des nombres premiers","d":"le nombre de premiers inférieurs à x est équivalent à x / ln x."},{"s":"Nombres et arithmétique","t":"Équation diophantienne","d":"équation dont on cherche les solutions entières."},{"s":"Nombres et arithmétique","t":"Triplet pythagoricien","d":"trois entiers (a, b, c) tels que a² + b² = c² (3, 4, 5)."},{"s":"Nombres et arithmétique","t":"Résidu quadratique","d":"entier qui est un carré modulo n."},{"s":"Nombres et arithmétique","t":"Racine primitive","d":"élément dont les puissances parcourent tous les inversibles modulo n."},{"s":"Nombres et arithmétique","t":"Entier de Gauss","d":"nombre complexe a + ib avec a et b entiers."},{"s":"Nombres et arithmétique","t":"Fonction ζ de Riemann","d":"ζ(s) = somme de 1/nˢ."},{"s":"Nombres et arithmétique","t":"Fonction de Möbius","d":"fonction arithmétique valant 0, 1 ou −1 selon la décomposition en facteurs premiers."},{"s":"Nombres et arithmétique","t":"Factorielle (n!)","d":"produit des entiers de 1 à n."},{"s":"Nombres et arithmétique","t":"Valeur absolue","d":"distance d'un réel à zéro."},{"s":"Nombres et arithmétique","t":"Partie entière","d":"plus grand entier inférieur ou égal à un réel."},{"s":"Nombres et arithmétique","t":"Partie décimale (fractionnaire)","d":"différence entre un réel et sa partie entière."},{"s":"Nombres et arithmétique","t":"Opposé","d":"nombre qui, ajouté à x, donne 0."},{"s":"Nombres et arithmétique","t":"Inverse","d":"nombre qui, multiplié par x, donne 1."},{"s":"Nombres et arithmétique","t":"Racine carrée","d":"nombre positif dont le carré est le nombre donné."},{"s":"Nombres et arithmétique","t":"Racine n-ième","d":"nombre positif dont la puissance n est le nombre donné."},{"s":"Nombres et arithmétique","t":"Puissance","d":"produit répété d'un même facteur."},{"s":"Nombres et arithmétique","t":"Exposant","d":"petit nombre qui indique combien de fois on multiplie la base."},{"s":"Nombres et arithmétique","t":"Notation scientifique","d":"écriture a × 10ⁿ avec 1 ≤ a < 10."},{"s":"Nombres et arithmétique","t":"Fraction","d":"quotient de deux nombres écrit sous la forme a/b."},{"s":"Nombres et arithmétique","t":"Numérateur / dénominateur","d":"nombre du haut / du bas d'une fraction."},{"s":"Nombres et arithmétique","t":"Fraction irréductible","d":"fraction dont le numérateur et le dénominateur sont premiers entre eux."},{"s":"Nombres et arithmétique","t":"Dénominateur commun","d":"multiple commun de dénominateurs qui permet d'additionner des fractions."},{"s":"Nombres et arithmétique","t":"Fraction continue","d":"écriture d'un nombre sous la forme a₀ + 1/(a₁ + 1/(a₂ + …))."},{"s":"Nombres et arithmétique","t":"Développement décimal périodique","d":"développement qui répète indéfiniment un même bloc de chiffres."},{"s":"Nombres et arithmétique","t":"Base de numération","d":"nombre de symboles utilisés pour écrire les entiers (10 décimal, 2 binaire, 16 hexadécimal)."},{"s":"Nombres et arithmétique","t":"Pourcentage","d":"fraction exprimée sur 100."},{"s":"Nombres et arithmétique","t":"Coefficient multiplicateur","d":"nombre par lequel on multiplie pour appliquer une évolution (1 + t/100)."},{"s":"Nombres et arithmétique","t":"Taux d'évolution","d":"variation relative entre valeur initiale et valeur finale."},{"s":"Nombres et arithmétique","t":"Proportionnalité","d":"situation où deux grandeurs sont liées par un coefficient constant."},{"s":"Nombres et arithmétique","t":"Règle de trois","d":"calcul de la quatrième proportionnelle dans un tableau de proportionnalité."},{"s":"Nombres et arithmétique","t":"Moyenne pondérée","d":"moyenne où chaque valeur est affectée d'un coefficient."},{"s":"Nombres et arithmétique","t":"Intérêts simples (composés)","d":"intérêts calculés toujours sur le capital initial (sur le capital augmenté des intérêts)."},{"s":"Nombres et arithmétique","t":"Encadrement","d":"double inégalité qui situe un nombre entre deux valeurs."},{"s":"Nombres et arithmétique","t":"Valeur approchée par défaut (par excès)","d":"valeur inférieure (supérieure) au nombre exact."},{"s":"Nombres et arithmétique","t":"Arrondi","d":"valeur approchée choisie au plus proche d'un ordre donné."},{"s":"Nombres et arithmétique","t":"Troncature","d":"approximation obtenue en supprimant les chiffres après un rang donné."},{"s":"Nombres et arithmétique","t":"Ordre de grandeur","d":"puissance de dix la plus proche d'un nombre."},{"s":"Calcul algébrique et équations","t":"Expression algébrique","d":"combinaison de nombres, de lettres et d'opérations."},{"s":"Calcul algébrique et équations","t":"Monôme","d":"produit d'un nombre par une ou plusieurs variables à des puissances entières."},{"s":"Calcul algébrique et équations","t":"Binôme","d":"somme de deux monômes."},{"s":"Calcul algébrique et équations","t":"Trinôme","d":"somme de trois monômes, souvent du second degré."},{"s":"Calcul algébrique et équations","t":"Polynôme","d":"somme de monômes."},{"s":"Calcul algébrique et équations","t":"Degré","d":"plus grande puissance de la variable dans un polynôme."},{"s":"Calcul algébrique et équations","t":"Coefficient dominant","d":"coefficient du terme de plus haut degré."},{"s":"Calcul algébrique et équations","t":"Terme constant","d":"terme sans variable."},{"s":"Calcul algébrique et équations","t":"Polynôme unitaire (normalisé)","d":"polynôme dont le coefficient dominant vaut 1."},{"s":"Calcul algébrique et équations","t":"Développer","d":"transformer un produit en somme."},{"s":"Calcul algébrique et équations","t":"Factoriser","d":"transformer une somme en produit."},{"s":"Calcul algébrique et équations","t":"Réduire","d":"regrouper les termes semblables."},{"s":"Calcul algébrique et équations","t":"Identités remarquables","d":"(a+b)² = a²+2ab+b² ; (a−b)² = a²−2ab+b² ; (a+b)(a−b) = a²−b²."},{"s":"Calcul algébrique et équations","t":"Identité du cube","d":"(a+b)³ = a³+3a²b+3ab²+b³ et a³ − b³ = (a − b)(a² + ab + b²)."},{"s":"Calcul algébrique et équations","t":"Équation","d":"égalité contenant une inconnue."},{"s":"Calcul algébrique et équations","t":"Inéquation","d":"inégalité contenant une inconnue."},{"s":"Calcul algébrique et équations","t":"Solution","d":"valeur de l'inconnue qui vérifie l'équation."},{"s":"Calcul algébrique et équations","t":"Racine","d":"valeur qui annule un polynôme."},{"s":"Calcul algébrique et équations","t":"Multiplicité d'une racine","d":"nombre de fois où le facteur (x − a) divise le polynôme."},{"s":"Calcul algébrique et équations","t":"Racine double","d":"racine de multiplicité 2, cas du second degré avec Δ = 0."},{"s":"Calcul algébrique et équations","t":"Équation produit nul","d":"un produit est nul si et seulement si l'un de ses facteurs est nul."},{"s":"Calcul algébrique et équations","t":"Équation du second degré","d":"équation ax² + bx + c = 0 avec a ≠ 0."},{"s":"Calcul algébrique et équations","t":"Discriminant","d":"Δ = b² − 4ac, qui détermine le nombre de racines réelles."},{"s":"Calcul algébrique et équations","t":"Forme canonique","d":"écriture a(x − α)² + β d'un trinôme."},{"s":"Calcul algébrique et équations","t":"Forme factorisée","d":"écriture a(x − x₁)(x − x₂) d'un trinôme."},{"s":"Calcul algébrique et équations","t":"Relations de Viète","d":"somme des racines = −b/a ; produit des racines = c/a."},{"s":"Calcul algébrique et équations","t":"Équation bicarrée","d":"équation de la forme ax⁴ + bx² + c = 0."},{"s":"Calcul algébrique et équations","t":"Équation irrationnelle","d":"équation où l'inconnue figure sous un radical."},{"s":"Calcul algébrique et équations","t":"Équation exponentielle","d":"équation où l'inconnue figure en exposant."},{"s":"Calcul algébrique et équations","t":"Équation logarithmique","d":"équation où l'inconnue figure dans un logarithme."},{"s":"Calcul algébrique et équations","t":"Équation paramétrique","d":"équation contenant un paramètre dont dépend la résolution."},{"s":"Calcul algébrique et équations","t":"Système d'équations","d":"plusieurs équations à résoudre simultanément."},{"s":"Calcul algébrique et équations","t":"Méthode de substitution","d":"on exprime une inconnue en fonction de l'autre et on la remplace."},{"s":"Calcul algébrique et équations","t":"Méthode de combinaison (élimination)","d":"on additionne des équations pour supprimer une inconnue."},{"s":"Calcul algébrique et équations","t":"Pivot de Gauss","d":"méthode d'élimination qui rend un système triangulaire."},{"s":"Calcul algébrique et équations","t":"Règle de Cramer","d":"formule de résolution d'un système linéaire par des déterminants."},{"s":"Calcul algébrique et équations","t":"Division euclidienne de polynômes","d":"écriture A = BQ + R avec deg R < deg B."},{"s":"Calcul algébrique et équations","t":"Théorème du reste","d":"le reste de la division de P par (x − a) est P(a)."},{"s":"Calcul algébrique et équations","t":"Schéma de Horner","d":"méthode pour évaluer un polynôme avec peu de multiplications."},{"s":"Calcul algébrique et équations","t":"Théorème de d'Alembert-Gauss","d":"tout polynôme non constant à coefficients complexes admet au moins une racine complexe."},{"s":"Calcul algébrique et équations","t":"Polynôme irréductible","d":"polynôme non constant qui n'est pas un produit de deux polynômes de degré plus petit."},{"s":"Calcul algébrique et équations","t":"Interpolation de Lagrange","d":"construction du polynôme de degré minimal qui passe par des points donnés."},{"s":"Calcul algébrique et équations","t":"Polynôme symétrique","d":"polynôme invariant par permutation de ses variables."},{"s":"Calcul algébrique et équations","t":"Fraction rationnelle","d":"quotient de deux polynômes."},{"s":"Calcul algébrique et équations","t":"Éléments simples","d":"fractions de la forme A/(x − a)ᵏ servant à décomposer une fraction rationnelle."},{"s":"Calcul algébrique et équations","t":"Inégalité triangulaire","d":"|a + b| ≤ |a| + |b|."},{"s":"Calcul algébrique et équations","t":"Inégalité arithmético-géométrique","d":"la moyenne géométrique est inférieure ou égale à la moyenne arithmétique."},{"s":"Calcul algébrique et équations","t":"Inégalité de Cauchy-Schwarz","d":"(somme des aᵢbᵢ)² ≤ (somme des aᵢ²)(somme des bᵢ²)."},{"s":"Calcul algébrique et équations","t":"Inégalité de Bernoulli","d":"(1 + x)ⁿ ≥ 1 + nx pour x ≥ −1 et n entier."},{"s":"Calcul algébrique et équations","t":"Inégalité de Jensen","d":"pour une fonction convexe f, f(moyenne) ≤ moyenne des f."},{"s":"Calcul algébrique et équations","t":"Inégalité de Tchebychev","d":"pour des suites rangées dans le même ordre, produit des moyennes ≤ moyenne des produits."},{"s":"Calcul algébrique et équations","t":"Inégalité du réarrangement","d":"la somme des produits est maximale quand les suites sont rangées dans le même ordre."},{"s":"Calcul algébrique et équations","t":"Inégalité de Hölder","d":"généralisation de Cauchy-Schwarz avec des exposants conjugués."},{"s":"Calcul algébrique et équations","t":"Inégalité de Minkowski","d":"inégalité triangulaire pour les normes p."},{"s":"Calcul algébrique et équations","t":"Moyenne arithmétique","d":"(a + b)/2."},{"s":"Calcul algébrique et équations","t":"Moyenne géométrique","d":"√(ab)."},{"s":"Calcul algébrique et équations","t":"Moyenne harmonique","d":"2ab/(a + b)."},{"s":"Calcul algébrique et équations","t":"Moyenne quadratique","d":"√((a² + b²)/2)."},{"s":"Fonctions","t":"Fonction","d":"relation qui associe à chaque élément de l'ensemble de départ au plus un élément d'arrivée."},{"s":"Fonctions","t":"Ensemble de définition","d":"ensemble des valeurs pour lesquelles la fonction est calculable."},{"s":"Fonctions","t":"Ensemble d'arrivée (codomaine)","d":"ensemble dans lequel la fonction prend ses valeurs."},{"s":"Fonctions","t":"Image","d":"valeur f(x) associée à x."},{"s":"Fonctions","t":"Antécédent","d":"valeur x telle que f(x) = y."},{"s":"Fonctions","t":"Graphe (courbe représentative)","d":"ensemble des points (x ; f(x))."},{"s":"Fonctions","t":"Fonction définie par morceaux","d":"fonction dont l'expression change selon les intervalles."},{"s":"Fonctions","t":"Fonction constante","d":"fonction qui prend toujours la même valeur."},{"s":"Fonctions","t":"Fonction linéaire","d":"fonction f(x) = ax."},{"s":"Fonctions","t":"Fonction affine","d":"fonction f(x) = ax + b."},{"s":"Fonctions","t":"Fonction polynôme","d":"fonction définie par un polynôme."},{"s":"Fonctions","t":"Fonction rationnelle","d":"quotient de deux polynômes."},{"s":"Fonctions","t":"Fonction homographique","d":"fonction (ax + b)/(cx + d)."},{"s":"Fonctions","t":"Fonction inverse","d":"fonction f(x) = 1/x, de courbe l'hyperbole."},{"s":"Fonctions","t":"Fonction carré / cube / racine","d":"fonctions x², x³, √x."},{"s":"Fonctions","t":"Fonction valeur absolue","d":"fonction |x|, de courbe en V."},{"s":"Fonctions","t":"Fonction partie entière","d":"fonction qui à x associe le plus grand entier inférieur ou égal à x."},{"s":"Fonctions","t":"Fonction en escalier","d":"fonction constante par morceaux."},{"s":"Fonctions","t":"Fonction signe","d":"fonction qui vaut −1, 0 ou 1 selon le signe de x."},{"s":"Fonctions","t":"Fonction exponentielle","d":"fonction eˣ, égale à sa propre dérivée."},{"s":"Fonctions","t":"Fonction logarithme népérien","d":"fonction ln, réciproque de l'exponentielle."},{"s":"Fonctions","t":"Logarithme décimal","d":"fonction log, telle que log(10ⁿ) = n."},{"s":"Fonctions","t":"Fonctions hyperboliques","d":"sh, ch et th, définies à partir de l'exponentielle."},{"s":"Fonctions","t":"Fonctions circulaires","d":"sin, cos, tan."},{"s":"Fonctions","t":"Fonctions circulaires réciproques","d":"arcsin, arccos, arctan."},{"s":"Fonctions","t":"Fonction injective","d":"deux éléments distincts ont des images distinctes."},{"s":"Fonctions","t":"Fonction surjective","d":"tout élément d'arrivée a au moins un antécédent."},{"s":"Fonctions","t":"Fonction bijective","d":"à la fois injective et surjective."},{"s":"Fonctions","t":"Bijection réciproque","d":"fonction qui « défait » une bijection."},{"s":"Fonctions","t":"Composée","d":"fonction g∘f définie par g(f(x))."},{"s":"Fonctions","t":"Fonction paire","d":"f(−x) = f(x), courbe symétrique par rapport à l'axe des ordonnées."},{"s":"Fonctions","t":"Fonction impaire","d":"f(−x) = −f(x), courbe symétrique par rapport à l'origine."},{"s":"Fonctions","t":"Fonction périodique","d":"fonction qui se répète à intervalles réguliers : f(x + T) = f(x)."},{"s":"Fonctions","t":"Croissante (décroissante)","d":"fonction qui conserve (inverse) l'ordre."},{"s":"Fonctions","t":"Strictement monotone","d":"fonction strictement croissante ou strictement décroissante."},{"s":"Fonctions","t":"Majorée / minorée / bornée","d":"fonction dont les valeurs sont inférieures / supérieures / entre deux bornes."},{"s":"Fonctions","t":"Extremum","d":"maximum ou minimum d'une fonction."},{"s":"Fonctions","t":"Extremum local","d":"plus grande ou plus petite valeur au voisinage d'un point."},{"s":"Fonctions","t":"Zéro d'une fonction","d":"valeur de x où f(x) = 0."},{"s":"Fonctions","t":"Point fixe","d":"valeur x telle que f(x) = x."},{"s":"Fonctions","t":"Fonction lipschitzienne","d":"fonction dont les variations sont contrôlées par une constante : |f(x) − f(y)| ≤ k|x − y|."},{"s":"Fonctions","t":"Fonction convexe","d":"fonction dont la courbe est située sous ses cordes."},{"s":"Fonctions","t":"Fonction concave","d":"fonction dont la courbe est située au-dessus de ses cordes."},{"s":"Fonctions","t":"Fonction de classe Cᵏ","d":"fonction dérivable k fois avec une dérivée k-ième continue."},{"s":"Fonctions","t":"Fonction analytique","d":"fonction égale à la somme de sa série de Taylor au voisinage de chaque point."},{"s":"Fonctions","t":"Fonction Gamma","d":"prolongement de la factorielle aux nombres non entiers."},{"s":"Fonctions","t":"Tableau de variations","d":"tableau qui résume le sens de variation d'une fonction."},{"s":"Fonctions","t":"Tableau de signes","d":"tableau qui donne le signe d'une expression selon x."},{"s":"Fonctions","t":"Parabole","d":"courbe d'une fonction du second degré."},{"s":"Fonctions","t":"Sommet","d":"point extrême d'une parabole."},{"s":"Fonctions","t":"Hyperbole","d":"courbe de la fonction inverse."},{"s":"Suites et séries","t":"Suite","d":"fonction définie sur les entiers naturels."},{"s":"Suites et séries","t":"Terme général","d":"expression de uₙ en fonction de n."},{"s":"Suites et séries","t":"Rang","d":"indice n d'un terme uₙ."},{"s":"Suites et séries","t":"Suite explicite","d":"suite définie directement par une formule en n."},{"s":"Suites et séries","t":"Suite récurrente","d":"suite définie à partir de ses termes précédents."},{"s":"Suites et séries","t":"Suite arithmétique","d":"chaque terme s'obtient en ajoutant une constante, la raison, au précédent."},{"s":"Suites et séries","t":"Suite géométrique","d":"chaque terme s'obtient en multipliant le précédent par une constante, la raison."},{"s":"Suites et séries","t":"Suite arithmético-géométrique","d":"suite de la forme uₙ₊₁ = a uₙ + b."},{"s":"Suites et séries","t":"Récurrence linéaire d'ordre 2","d":"suite où uₙ₊₂ dépend linéairement de uₙ₊₁ et uₙ."},{"s":"Suites et séries","t":"Équation caractéristique","d":"équation du second degré associée à une récurrence linéaire d'ordre 2."},{"s":"Suites et séries","t":"Raison","d":"constante ajoutée ou multipliée d'un terme au suivant."},{"s":"Suites et séries","t":"Suite croissante (décroissante)","d":"suite dont chaque terme est supérieur (inférieur) au précédent."},{"s":"Suites et séries","t":"Suite monotone","d":"suite croissante ou décroissante."},{"s":"Suites et séries","t":"Suite majorée / minorée / bornée","d":"suite dont les termes sont inférieurs / supérieurs / entre deux réels."},{"s":"Suites et séries","t":"Suite stationnaire","d":"suite constante à partir d'un certain rang."},{"s":"Suites et séries","t":"Suite convergente","d":"suite qui admet une limite finie."},{"s":"Suites et séries","t":"Suite divergente","d":"suite qui n'a pas de limite finie."},{"s":"Suites et séries","t":"Limite d'une suite","d":"valeur dont les termes se rapprochent indéfiniment."},{"s":"Suites et séries","t":"Théorème des gendarmes","d":"une suite encadrée par deux suites de même limite a cette limite."},{"s":"Suites et séries","t":"Théorème de convergence monotone","d":"toute suite croissante majorée converge."},{"s":"Suites et séries","t":"Suites adjacentes","d":"suites dont l'une croît, l'autre décroît, et dont la différence tend vers 0."},{"s":"Suites et séries","t":"Suites équivalentes","d":"suites dont le quotient tend vers 1."},{"s":"Suites et séries","t":"Suite négligeable","d":"suite uₙ = o(vₙ) quand uₙ/vₙ tend vers 0."},{"s":"Suites et séries","t":"Suite extraite (sous-suite)","d":"suite obtenue en ne gardant qu'une partie des termes en conservant l'ordre."},{"s":"Suites et séries","t":"Valeur d'adhérence","d":"limite d'une suite extraite."},{"s":"Suites et séries","t":"Théorème de Bolzano-Weierstrass","d":"toute suite bornée de réels admet une suite extraite convergente."},{"s":"Suites et séries","t":"Suite de Cauchy","d":"suite dont les termes deviennent arbitrairement proches les uns des autres."},{"s":"Suites et séries","t":"Somme des n premiers entiers","d":"n(n + 1)/2."},{"s":"Suites et séries","t":"Somme des n premiers carrés","d":"n(n + 1)(2n + 1)/6."},{"s":"Suites et séries","t":"Somme des n premiers cubes","d":"(n(n + 1)/2)²."},{"s":"Suites et séries","t":"Somme arithmétique","d":"nombre de termes × (premier + dernier) / 2."},{"s":"Suites et séries","t":"Somme géométrique","d":"1 + q + … + qⁿ = (1 − qⁿ⁺¹)/(1 − q) pour q ≠ 1."},{"s":"Suites et séries","t":"Suite de Fibonacci","d":"chaque terme est la somme des deux précédents (0, 1, 1, 2, 3, 5…)."},{"s":"Suites et séries","t":"Suite de Lucas","d":"même récurrence que Fibonacci avec les termes initiaux 2 et 1."},{"s":"Suites et séries","t":"Nombres de Catalan","d":"suite C(2n, n)/(n + 1) qui compte de nombreuses structures combinatoires."},{"s":"Suites et séries","t":"Série","d":"somme infinie des termes d'une suite."},{"s":"Suites et séries","t":"Série convergente","d":"série dont les sommes partielles ont une limite finie."},{"s":"Suites et séries","t":"Série géométrique","d":"série de terme qⁿ, convergente si |q| < 1."},{"s":"Suites et séries","t":"Série harmonique","d":"série de terme 1/n, divergente."},{"s":"Suites et séries","t":"Série de Riemann","d":"série de terme 1/nᵅ, convergente si α > 1."},{"s":"Suites et séries","t":"Série télescopique","d":"série dont les termes s'annulent deux à deux dans les sommes partielles."},{"s":"Suites et séries","t":"Série alternée","d":"série dont les termes sont alternativement positifs et négatifs."},{"s":"Suites et séries","t":"Critère de Leibniz","d":"une série alternée dont les termes décroissent vers 0 converge."},{"s":"Suites et séries","t":"Convergence absolue","d":"convergence de la série des valeurs absolues."},{"s":"Suites et séries","t":"Critère de d'Alembert","d":"critère fondé sur la limite de uₙ₊₁/uₙ."},{"s":"Suites et séries","t":"Critère de Cauchy (racine)","d":"critère fondé sur la limite de la racine n-ième de uₙ."},{"s":"Suites et séries","t":"Produit de Cauchy","d":"produit de deux séries défini par des sommes de convolution."},{"s":"Suites et séries","t":"Série entière","d":"série de la forme somme aₙxⁿ."},{"s":"Suites et séries","t":"Rayon de convergence","d":"plus grand r tel que la série entière converge pour |x| < r."},{"s":"Suites et séries","t":"Série de Taylor","d":"série entière formée avec les dérivées successives en un point."},{"s":"Suites et séries","t":"Série de Fourier","d":"décomposition d'une fonction périodique en sinus et cosinus."},{"s":"Limites, continuité et dérivation","t":"Limite d'une fonction","d":"valeur dont f(x) se rapproche quand x tend vers un point ou vers l'infini."},{"s":"Limites, continuité et dérivation","t":"Limite à gauche (à droite)","d":"limite quand x tend vers a par valeurs inférieures (supérieures)."},{"s":"Limites, continuité et dérivation","t":"Forme indéterminée","d":"limite dont la forme ne permet pas de conclure (∞ − ∞, 0/0, ∞/∞, 0 × ∞, 1^∞)."},{"s":"Limites, continuité et dérivation","t":"Croissances comparées","d":"à l'infini, l'exponentielle l'emporte sur toute puissance, qui l'emporte sur le logarithme."},{"s":"Limites, continuité et dérivation","t":"Équivalent","d":"f est équivalente à g si f/g tend vers 1."},{"s":"Limites, continuité et dérivation","t":"Notation o de Landau","d":"f = o(g) signifie que f/g tend vers 0."},{"s":"Limites, continuité et dérivation","t":"Notation O de Landau","d":"f = O(g) signifie que f/g reste borné."},{"s":"Limites, continuité et dérivation","t":"Continuité","d":"propriété d'une courbe que l'on peut tracer sans lever le crayon."},{"s":"Limites, continuité et dérivation","t":"Continuité uniforme","d":"continuité où le seuil ne dépend pas du point choisi."},{"s":"Limites, continuité et dérivation","t":"Théorème des valeurs intermédiaires","d":"une fonction continue sur un intervalle prend toutes les valeurs entre f(a) et f(b)."},{"s":"Limites, continuité et dérivation","t":"Théorème de la bijection","d":"une fonction continue et strictement monotone sur un intervalle réalise une bijection sur son image."},{"s":"Limites, continuité et dérivation","t":"Théorème de Weierstrass","d":"une fonction continue sur un segment est bornée et atteint ses bornes."},{"s":"Limites, continuité et dérivation","t":"Asymptote","d":"droite dont la courbe se rapproche indéfiniment."},{"s":"Limites, continuité et dérivation","t":"Asymptote verticale","d":"droite x = a au voisinage de laquelle la fonction tend vers l'infini."},{"s":"Limites, continuité et dérivation","t":"Asymptote horizontale","d":"droite y = l vers laquelle la courbe tend à l'infini."},{"s":"Limites, continuité et dérivation","t":"Asymptote oblique","d":"droite y = ax + b dont la courbe se rapproche à l'infini."},{"s":"Limites, continuité et dérivation","t":"Branche parabolique","d":"branche infinie qui n'admet pas d'asymptote."},{"s":"Limites, continuité et dérivation","t":"Dérivée","d":"limite du taux d'accroissement, pente de la tangente."},{"s":"Limites, continuité et dérivation","t":"Nombre dérivé","d":"valeur de la dérivée en un point."},{"s":"Limites, continuité et dérivation","t":"Taux d'accroissement","d":"quotient (f(x+h) − f(x))/h."},{"s":"Limites, continuité et dérivation","t":"Fonction dérivable","d":"fonction qui admet un nombre dérivé en tout point de son ensemble."},{"s":"Limites, continuité et dérivation","t":"Tangente","d":"droite qui touche la courbe en un point avec la même pente."},{"s":"Limites, continuité et dérivation","t":"Point anguleux","d":"point où les dérivées à gauche et à droite existent mais diffèrent."},{"s":"Limites, continuité et dérivation","t":"Point de rebroussement","d":"point où la courbe fait demi-tour avec une tangente commune."},{"s":"Limites, continuité et dérivation","t":"Dérivée seconde","d":"dérivée de la dérivée."},{"s":"Limites, continuité et dérivation","t":"Point critique (stationnaire)","d":"point où la dérivée s'annule."},{"s":"Limites, continuité et dérivation","t":"Point d'inflexion","d":"point où la courbe change de concavité."},{"s":"Limites, continuité et dérivation","t":"Dérivée d'un produit","d":"(uv)' = u'v + uv'."},{"s":"Limites, continuité et dérivation","t":"Dérivée d'un quotient","d":"(u/v)' = (u'v − uv')/v²."},{"s":"Limites, continuité et dérivation","t":"Dérivée d'une composée","d":"(g∘f)' = f' × g'(f)."},{"s":"Limites, continuité et dérivation","t":"Dérivée de xⁿ","d":"nxⁿ⁻¹."},{"s":"Limites, continuité et dérivation","t":"Dérivée de eˣ, ln x","d":"eˣ et 1/x."},{"s":"Limites, continuité et dérivation","t":"Dérivée de sin, cos","d":"cos et −sin."},{"s":"Limites, continuité et dérivation","t":"Dérivée logarithmique","d":"quotient f'/f."},{"s":"Limites, continuité et dérivation","t":"Théorème de Rolle","d":"si f(a) = f(b), la dérivée s'annule en un point entre a et b."},{"s":"Limites, continuité et dérivation","t":"Théorème des accroissements finis","d":"il existe c tel que f(b) − f(a) = f'(c)(b − a)."},{"s":"Limites, continuité et dérivation","t":"Règle de L'Hôpital","d":"levée d'indétermination par le quotient des dérivées."},{"s":"Limites, continuité et dérivation","t":"Formule de Taylor","d":"approximation d'une fonction par un polynôme construit avec ses dérivées en un point."},{"s":"Limites, continuité et dérivation","t":"Développement limité","d":"approximation polynomiale d'une fonction au voisinage d'un point, avec un reste négligeable."},{"s":"Limites, continuité et dérivation","t":"Différentielle","d":"meilleure approximation linéaire d'une fonction en un point."},{"s":"Limites, continuité et dérivation","t":"Dérivée partielle","d":"dérivée par rapport à une variable, les autres étant fixées."},{"s":"Limites, continuité et dérivation","t":"Gradient","d":"vecteur des dérivées partielles."},{"s":"Limites, continuité et dérivation","t":"Matrice jacobienne","d":"matrice des dérivées partielles d'une fonction de plusieurs variables."},{"s":"Limites, continuité et dérivation","t":"Matrice hessienne","d":"matrice des dérivées partielles secondes."},{"s":"Limites, continuité et dérivation","t":"Laplacien","d":"somme des dérivées partielles secondes par rapport à chaque variable."},{"s":"Limites, continuité et dérivation","t":"Divergence","d":"opérateur qui mesure la source d'un champ de vecteurs."},{"s":"Limites, continuité et dérivation","t":"Rotationnel","d":"opérateur qui mesure la rotation locale d'un champ de vecteurs."},{"s":"Limites, continuité et dérivation","t":"Théorème de Schwarz","d":"les dérivées partielles croisées sont égales si elles sont continues."},{"s":"Limites, continuité et dérivation","t":"Multiplicateurs de Lagrange","d":"méthode d'optimisation sous contrainte."},{"s":"Limites, continuité et dérivation","t":"Convexité","d":"propriété d'une fonction dont la dérivée seconde est positive."},{"s":"Intégration et équations différentielles","t":"Primitive","d":"fonction dont la dérivée est la fonction donnée."},{"s":"Intégration et équations différentielles","t":"Intégrale","d":"aire algébrique sous la courbe entre deux bornes."},{"s":"Intégration et équations différentielles","t":"Intégrale de Riemann","d":"limite de sommes d'aires de rectangles."},{"s":"Intégration et équations différentielles","t":"Théorème fondamental de l'analyse","d":"l'intégrale d'une fonction continue est une primitive, et l'intégrale de f' est f(b) − f(a)."},{"s":"Intégration et équations différentielles","t":"Relation de Chasles (intégrales)","d":"intégrale de a à c = intégrale de a à b + intégrale de b à c."},{"s":"Intégration et équations différentielles","t":"Intégration par parties","d":"∫u'v = [uv] − ∫uv'."},{"s":"Intégration et équations différentielles","t":"Changement de variable","d":"substitution qui simplifie le calcul d'une intégrale."},{"s":"Intégration et équations différentielles","t":"Valeur moyenne","d":"(1/(b − a)) × intégrale de f entre a et b."},{"s":"Intégration et équations différentielles","t":"Intégrale impropre","d":"intégrale sur un intervalle non borné ou d'une fonction non bornée."},{"s":"Intégration et équations différentielles","t":"Intégrale double (triple)","d":"intégrale sur une partie du plan (de l'espace)."},{"s":"Intégration et équations différentielles","t":"Théorème de Fubini","d":"une intégrale double se calcule par deux intégrales simples successives."},{"s":"Intégration et équations différentielles","t":"Jacobien","d":"déterminant qui intervient dans un changement de variables multiple."},{"s":"Intégration et équations différentielles","t":"Intégrale de Lebesgue","d":"intégrale définie à partir d'une mesure, plus générale que Riemann."},{"s":"Intégration et équations différentielles","t":"Intégrale curviligne","d":"intégrale le long d'une courbe."},{"s":"Intégration et équations différentielles","t":"Théorème de Green","d":"relie une intégrale double à une intégrale curviligne."},{"s":"Intégration et équations différentielles","t":"Théorème de Stokes","d":"relie le flux d'un rotationnel à la circulation sur le bord."},{"s":"Intégration et équations différentielles","t":"Théorème de Gauss-Ostrogradski","d":"relie le flux d'un champ à l'intégrale de sa divergence."},{"s":"Intégration et équations différentielles","t":"Équation différentielle","d":"équation dont l'inconnue est une fonction et qui contient ses dérivées."},{"s":"Intégration et équations différentielles","t":"Ordre d'une équation différentielle","d":"ordre de la plus haute dérivée qui y figure."},{"s":"Intégration et équations différentielles","t":"Équation différentielle linéaire","d":"équation où l'inconnue et ses dérivées apparaissent à la puissance 1."},{"s":"Intégration et équations différentielles","t":"Équation homogène","d":"équation linéaire sans second membre."},{"s":"Intégration et équations différentielles","t":"Solution particulière","d":"une solution de l'équation complète."},{"s":"Intégration et équations différentielles","t":"Solution générale","d":"ensemble de toutes les solutions."},{"s":"Intégration et équations différentielles","t":"Problème de Cauchy","d":"équation différentielle assortie d'une condition initiale."},{"s":"Intégration et équations différentielles","t":"Séparation des variables","d":"méthode qui regroupe d'un côté les y et de l'autre les x."},{"s":"Intégration et équations différentielles","t":"Variation de la constante","d":"méthode pour trouver une solution particulière."},{"s":"Intégration et équations différentielles","t":"Théorème de Cauchy-Lipschitz","d":"existence et unicité de la solution d'un problème de Cauchy sous des hypothèses de régularité."},{"s":"Intégration et équations différentielles","t":"Équation aux dérivées partielles","d":"équation dont l'inconnue est une fonction de plusieurs variables."},{"s":"Intégration et équations différentielles","t":"Transformée de Laplace","d":"transformation qui ramène une équation différentielle à une équation algébrique."},{"s":"Intégration et équations différentielles","t":"Transformée de Fourier","d":"transformation qui décompose une fonction en fréquences."},{"s":"Intégration et équations différentielles","t":"Convolution","d":"opération qui mélange deux fonctions par intégration."},{"s":"Géométrie plane","t":"Point","d":"objet sans dimension qui marque une position."},{"s":"Géométrie plane","t":"Droite","d":"ligne illimitée dans les deux sens."},{"s":"Géométrie plane","t":"Demi-droite","d":"droite limitée d'un côté par une origine."},{"s":"Géométrie plane","t":"Segment","d":"partie de droite délimitée par deux points."},{"s":"Géométrie plane","t":"Milieu","d":"point d'un segment à égale distance des extrémités."},{"s":"Géométrie plane","t":"Points alignés","d":"points situés sur une même droite."},{"s":"Géométrie plane","t":"Droites concourantes","d":"droites qui passent par un même point."},{"s":"Géométrie plane","t":"Droites parallèles","d":"droites qui ne se coupent pas ou sont confondues."},{"s":"Géométrie plane","t":"Droites perpendiculaires","d":"droites qui se coupent à angle droit."},{"s":"Géométrie plane","t":"Droites sécantes","d":"droites qui se coupent en un point."},{"s":"Géométrie plane","t":"Angle aigu","d":"angle inférieur à 90°."},{"s":"Géométrie plane","t":"Angle droit","d":"angle de 90°."},{"s":"Géométrie plane","t":"Angle obtus","d":"angle compris entre 90° et 180°."},{"s":"Géométrie plane","t":"Angle plat","d":"angle de 180°."},{"s":"Géométrie plane","t":"Angle rentrant","d":"angle compris entre 180° et 360°."},{"s":"Géométrie plane","t":"Angle plein","d":"angle de 360°."},{"s":"Géométrie plane","t":"Angles complémentaires","d":"angles de somme 90°."},{"s":"Géométrie plane","t":"Angles supplémentaires","d":"angles de somme 180°."},{"s":"Géométrie plane","t":"Angles adjacents","d triangle ayant un angle droit."},{"s":"Géométrie plane","t":"Hypoténuse","d":"côté opposé à l'angle droit."},{"s":"Géométrie plane","t":"Théorème de Pythagore","d":"dans un triangle rectangle, le carré de l'hypoténuse égale la somme des carrés des deux autres côtés."},{"s":"Géométrie plane","t":"Théorème de Thalès","d":"dans deux triangles emboîtés à côtés parallèles, les longueurs sont proportionnelles."},{"s":"Géométrie plane","t":"Inégalité triangulaire (géométrie)","d":"chaque côté d'un triangle est inférieur à la somme des deux autres."},{"s":"Géométrie plane","t":"Théorème de la médiane (Apollonius)","d":"AB² + AC² = 2AI² + BC²/2, où I est le milieu de BC."},{"s":"Géométrie plane","t":"Théorème d'Al-Kashi","d":"a² = b² + c² − 2bc cos A."},{"s":"Géométrie plane","t":"Formule de Héron","d":"aire = √(p(p − a)(p − b)(p − c)), où p est le demi-périmètre."},{"s":"Géométrie plane","t":"Théorème de Ménélaüs","d":"relation sur les rapports de longueurs quand une droite coupe les côtés d'un triangle."},{"s":"Géométrie plane","t":"Théorème de Céva","d":"relation sur les rapports de longueurs pour trois céviennes concourantes."},{"s":"Géométrie plane","t":"Théorème de Ptolémée","d":"dans un quadrilatère inscrit, le produit des diagonales égale la somme des produits des côtés opposés."},{"s":"Géométrie plane","t":"Triangles semblables","d":"triangles aux angles égaux et aux côtés proportionnels."},{"s":"Géométrie plane","t":"Triangles isométriques (égaux)","d":"triangles superposables."},{"s":"Géométrie plane","t":"Cas d'égalité des triangles","d":"CCC, CAC et ACA."},{"s":"Géométrie plane","t":"Parallélogramme","d":"quadrilatère dont les côtés opposés sont parallèles."},{"s":"Géométrie plane","t":"Rectangle","d":"parallélogramme à quatre angles droits."},{"s":"Géométrie plane","t":"Losange","d":"quadrilatère à quatre côtés égaux."},{"s":"Géométrie plane","t":"Carré","d":"quadrilatère à quatre côtés égaux et quatre angles droits."},{"s":"Géométrie plane","t":"Trapèze","d":" Sinus","d":"dans un triangle rectangle, côté opposé / hypoténuse."},{"s":"Trigonométrie","t":"Cosinus","d":"côté adjacent / hypoténuse."},{"s":"Trigonométrie","t":"Tangente","d":"côté opposé / côté adjacent, ou sin / cos."},{"s":"Trigonométrie","t":"Cotangente","d":"inverse de la tangente."},{"s":"Trigonométrie","t":"Sécante (cosécante)","d":"inverse du cosinus (du sinus)."},{"s":"Trigonométrie","t":"Cercle trigonométrique","d":"cercle de rayon 1 où cos et sin sont les coordonnées d'un point."},{"s":"Trigonométrie","t":"Mesure principale","d":"mesure d'un angle orienté choisie dans ]−π ; π]."},{"s":"Trigonométrie","t":"Période","d":"plus petit T > 0 tel que f(x + T) = f(x) (2π pour sin et cos, π pour tan)."},{"s":"Trigonométrie","t":"Amplitude","d":"écart maximal d'une sinusoïde par rapport à sa valeur moyenne."},{"s":"Trigonométrie","t":"Relation fondamentale","d":"cos²x + sin²x = 1."},{"s":"Trigonométrie","t":"Formule d'addition (cosinus)","d":"cos(a + b) = cos a cos b − sin a sin b."},{"s":"Trigonométrie","t":"Formule d'addition (sinus)","d":"sin(a + b) = sin a cos b + cos a sin b."},{"s":"Trigonométrie","t":"Formule de duplication","d":"cos 2a = cos²a − sin²a ; sin 2a = 2 sin a cos a."},{"s":"Trigonométrie","t":"Formules de linéarisation","d":"expressions de cos²a et sin²a en fonction de cos 2a."},{"s":"Trigonométrie","t":"Formules d'Euler","d":"cos x = (eⁱˣ + e⁻ⁱˣ)/2 et sin x = (eⁱˣ − e⁻ⁱˣ)/(2i)."},{"s":"Trigonométrie","t":"Formule de Moivre","d":"(cos θ + i sin θ)ⁿ = cos nθ + i sin nθ."},{"s":"Trigonométrie","t":"Loi des sinus","d":"a/sin A = b/sin B = c/sin C = 2R."},{"s":"Trigonométrie","t":"Loi des cosinus","d":"a² = b² + c² − 2bc cos A."},{"s":"Trigonométrie","t":"Valeurs remarquables","d":"sin 30° = 1/2, sin 45° = √2/2, sin 60° = √3/2, cos 30° = √3/2, cos 60° = 1/2."},{"s":"Trigonométrie","t":"Triangle sphérique","d":"triangle tracé sur une sphère dont les côtés sont des arcs de grands cercles."},{"s":"Trigonométrie","t":"Identité d'Euler","d":"e^(iπ) + 1 répétition d'épreuves de Bernoulli identiques et indépendantes."},{"s":"Dénombrement et probabilités","t":"Variable aléatoire","d":"fonction qui associe un nombre à chaque issue."},{"s":"Dénombrement et probabilités","t":"Loi de probabilité","d":"description des valeurs prises par une variable aléatoire et de leurs probabilités."},{"s":"Dénombrement et probabilités","t":"Fonction de répartition","d":"fonction F(x) = P(X ≤ x)."},{"s":"Dénombrement et probabilités","t":"Densité de probabilité","d":"fonction dont l'intégrale donne la probabilité d'une variable continue."},{"s":"Dénombrement et probabilités","t":"Espérance","d":"moyenne pondérée par les probabilités."},{"s":"Dénombrement et probabilités","t":"Variance","d":"espérance du carré des écarts à l'espérance."},{"s":"Dénombrement et probabilités","t":"Écart-type","d":"racine carrée de la variance."},{"s":"Dénombrement et probabilités","t":"Covariance","d":"mesure de la variation conjointe de deux variables aléatoires."},{"s":"Dénombrement et probabilités","t":"Loi de Bernoulli","d":"loi d'une épreuve à deux issues, succès ou échec."},{"s":"Dénombrement et probabilités","t":"Loi binomiale","d":"loi du nombre de succès dans n épreuves de Bernoulli indépendantes."},{"s":"Dénombrement et probabilités","t":"Loi géométrique","d":"loi du rang du premier succès dans une suite d'épreuves de Bernoulli."},{"s":"Dénombrement et probabilités","t":"Loi de Poisson","d":"loi des événements rares, d'espérance et de variance égales à λ."},{"s":"Dénombrement et probabilités","t":"Loi hypergéométrique","d":"loi du nombre de succès dans un tirage sans remise."},{"s":"Dénombrement et probabilités","t":"Loi uniforme","d":"loi où toutes les valeurs ont la même probabilité ou la même densité."},{"s":"Dénombrement et probabilités","t":"Loi exponentielle","d":"loi continue sans mémoire qui modélise des temps d'attente."},{"s":"Dénombrement et probabilités","t":"Loi normale","d":"loi continue en forme de cloche (de Gauss)."},{"s":"Dénombrement et probabilités","t":"Loi normale centrée réduite","d":"loi normale d'espérance 0 et d'écart-type 1."},{"s":"Dénombrement et probabilités","t":"Loi de Student","d":"loi utilisée pour estimer une moyenne avec un petit échantillon."},{"s":"Dénombrement et probabilités","t":"Loi du khi-deux","d":"loi de la somme de carrés de variables normales centrées réduites."},{"s":"Dénombrement et probabilités","t":"Inégalité de Markov","d":"P(X ≥ a) ≤ E(X)/a pour X positive."},{"s":"Dénombrement et probabilités","t":"Inégalité de Bienaymé-Tchebychev","d":"P(|X − E(X)| ≥ a) ≤ V(X)/a²."},{"s":"Dénombrement et probabilités","t":"Loi des grands nombres","d":"la fréquence observée se rapproche de la probabilité quand on répète l'expérience."},{"s":"Dénombrement et probabilités","t":"Théorème central limite","d":"la somme normalisée de variables indépendantes de même loi tend vers une loi normale."},{"s":"Dénombrement et probabilités","t":"Chaîne de Markov","d":"processus sans mémoire où l'avenir ne dépend que de l'état présent."},{"s":"Dénombrement et probabilités","t":"Marche aléatoire","d":"processus formé de pas aléatoires successifs."},{"s":"Dénombrement et probabilités","t":"Martingale","d":"processus dont l'espérance future, sachant le passé, est égale à la valeur présente."},{"s":"Dénombrement et probabilités","t":"Espérance conditionnelle","d":"espérance d'une variable sachant une information donnée."},{"s":"Statistiques","t":"Population","d":"ensemble étudié."},{"s":"Statistiques","t":"Individu","d":"élément de la population."},{"s":"Statistiques","t":"Échantillon","d":"partie de la population observée."},{"s":"Statistiques","t":"Caractère (variable)","d":"propriété étudiée."},{"s":"Statistiques","t":"Caractère qualitatif (quantitatif)","d":"caractère non numérique (numérique)."},{"s":"Statistiques","t":"Variable discrète (continue)","d":"variable qui prend des valeurs isolées (dans un intervalle)."},{"s":"Statistiques","t":"Effectif","d":"nombre d'individus ayant une valeur donnée."},{"s":"Statistiques","t":"Effectif total","d":"nombre d'individus de la population ou de l'échantillon."},{"s":"Statistiques","t":"Fréquence","d":"effectif divisé par l'effectif total."},{"s":"Statistiques","t":"Effectif cumulé (fréquence cumulée)","d":"somme des effectifs (fréquences) jusqu'à une valeur donnée."},{"s":"Statistiques","t":"Classe","d":"intervalle de valeurs regroupées."},{"s":"Statistiques","t":"Centre d'une classe","d":"milieu de l'intervalle d'une classe."},{"s":"Statistiques","t":"Moyenne","d":"somme des valeurs divisée par leur nombre."},{"s":"Statistiques","t":"Médiane","d":"valeur qui partage la série ordonnée en deux moitiés d'effectifs égaux."},{"s":"Statistiques","t":"Mode","d":"valeur la plus fréquente."},{"s":"Statistiques","t":"Étendue","d":"différence entre la plus grande et la plus petite valeur."},{"s":"Statistiques","t":"Quartiles","d":"valeurs qui partagent la série en quatre parts égales."},{"s":"Statistiques","t":"Écart interquartile","d":"différence entre le troisième et le premier quartile."},{"s":"Statistiques","t":"Déciles","d":"valeurs qui partagent la série en dix parts égales."},{"s":"Statistiques","t":"Écart absolu moyen","d":"moyenne des écarts en valeur absolue à la moyenne."},{"s":"Statistiques","t":"Coefficient de variation","d":"rapport de l'écart-type à la moyenne."},{"s":"Statistiques","t":"Valeur aberrante","d":"valeur très éloignée des autres."},{"s":"Statistiques","t":"Histogramme","d":"graphique à barres contiguës dont l'aire est proportionnelle à l'effectif."},{"s":"Statistiques","t":"Diagramme en barres (bâtons)","d":"graphique où la hauteur représente l'effectif."},{"s":"Statistiques","t":"Diagramme circulaire","d":"graphique en secteurs proportionnels aux effectifs."},{"s":"Statistiques","t":"Diagramme en boîte (boîte à moustaches)","d":"graphique qui représente médiane, quartiles et extrêmes."},{"s":"Statistiques","t":"Polygone des effectifs cumulés","d":"courbe qui relie les effectifs cumulés."},{"s":"Statistiques","t":"Série statistique double","d":"série où l'on observe deux caractères sur chaque individu."},{"s":"Statistiques","t":"Nuage de points","d":"représentation de deux variables par des points."},{"s":"Statistiques","t":"Point moyen","d":"point dont les coordonnées sont les moyennes des deux variables."},{"s":"Statistiques","t":"Corrélation","d":"lien statistique entre deux variables."},{"s":"Statistiques","t":"Coefficient de corrélation linéaire","d":"nombre entre −1 et 1 qui mesure la qualité d'un ajustement linéaire."},{"s":"Statistiques","t":"Droite de régression","d":"droite qui ajuste au mieux un nuage de points."},{"s":"Statistiques","t":"Méthode des moindres carrés","d":"méthode qui minimise la somme des carrés des écarts."},{"s":"Statistiques","t":"Résidu","d":"écart entre une valeur observée et la valeur prédite."},{"s":"Statistiques","t":"Échantillonnage","d":"prélèvement d'un échantillon dans une population."},{"s":"Statistiques","t":"Sondage","d":"enquête réalisée sur un échantillon."},{"s":"Statistiques","t":"Biais","d":"erreur systématique d'un estimateur ou d'un sondage."},{"s":"Statistiques","t":"Estimateur","d":"fonction des observations qui estime un paramètre."},{"s":"Statistiques","t":"Intervalle de fluctuation","d":"intervalle où la fréquence d'un échantillon se situe avec une probabilité donnée."},{"s":"Statistiques","t":"Intervalle de confiance","d":"intervalle qui contient, avec un niveau de confiance donné, la vraie valeur d'un paramètre."},{"s":"Statistiques","t":"Test d'hypothèse","d":"procédure de décision entre deux hypothèses à partir d'un échantillon."},{"s":"Statistiques","t":"Hypothèse nulle","d":"hypothèse de départ que l'on cherche à rejeter."},{"s":"Statistiques","t":"Niveau de signification","d":"probabilité maximale acceptée de rejeter à tort l'hypothèse nulle."},{"s":"Statistiques","t":"Valeur-p (p-value)","d":"probabilité d'observer un résultat au moins aussi extrême si l'hypothèse nulle est vraie."},{"s":"Statistiques","t":"Erreur de première espèce","d":"rejet à tort de l'hypothèse nulle."},{"s":"Statistiques","t":"Erreur de seconde espèce","d":"conservation à tort de l'hypothèse nulle."},{"s":"Théorie des graphes","t":"Graphe","d":"ensemble de sommets reliés par des arêtes."},{"s":"Théorie des graphes","t":"Sommet (nœud)","d":"point d'un graphe."},{"s":"Théorie des graphes","t":"Arête","d":"ligne qui relie deux sommets."},{"s":"Théorie des graphes","t":"Arc","d":"arête orientée."},{"s":"Théorie des graphes","t":"Graphe orienté","d":"graphe dont les arêtes ont un sens."},{"s":"Théorie des graphes","t":"Graphe simple","d":"graphe sans boucle ni arêtes multiples."},{"s":"Théorie des graphes","t":"Graphe complet","d":"graphe où tous les sommets sont reliés deux à deux."},{"s":"Théorie des graphes","t":"Graphe biparti","d":"graphe dont les sommets se partagent en deux groupes sans arête à l'intérieur d'un groupe."},{"s":"Théorie des graphes","t":"Graphe connexe","d":"graphe où l'on peut aller de tout sommet à tout autre."},{"s":"Théorie des graphes","t":"Degré d'un sommet","d":"nombre d'arêtes qui y aboutissent."},{"s":"Théorie des graphes","t":"Lemme des poignées de main","d":"la somme des degrés est égale à deux fois le nombre d'arêtes."},{"s":"Théorie des graphes","t":"Chaîne","d":"suite d'arêtes consécutives."},{"s":"Théorie des graphes","t":"Chemin","d":"suite d'arcs consécutifs dans un graphe orienté."},{"s":"Théorie des graphes","t":"Cycle","d":"chaîne fermée qui ne passe pas deux fois par la même arête."},{"s":"Théorie des graphes","t":"Circuit","d":"chemin fermé dans un graphe orienté."},{"s":"Théorie des graphes","t":"Arbre","d":"graphe connexe sans cycle."},{"s":"Théorie des graphes","t":"Forêt","d":"graphe sans cycle, réunion d'arbres."},{"s":"Théorie des graphes","t":"Arbre couvrant","d":"arbre qui contient tous les sommets d'un graphe."},{"s":"Théorie des graphes","t":"Graphe planaire","d":"graphe qu'on peut dessiner dans le plan sans croisement d'arêtes."},{"s":"Théorie des graphes","t":"Formule d'Euler (graphes)","d":"pour un graphe planaire connexe, sommets − arêtes + faces = 2."},{"s":"Théorie des graphes","t":"Nombre chromatique","d":"plus petit nombre de couleurs pour colorier les sommets sans que deux voisins aient la même."},{"s":"Théorie des graphes","t":"Théorème des quatre couleurs","d":"toute carte plane se colorie avec quatre couleurs."},{"s":"Théorie des graphes","t":"Graphe eulérien","d":"graphe qui admet un cycle passant une et une seule fois par chaque arête."},{"s":"Théorie des graphes","t":"Graphe hamiltonien","d":"graphe qui admet un cycle passant une et une seule fois par chaque sommet."},{"s":"Théorie des graphes","t":"Problème des ponts de Königsberg","d":"problème historique résolu par Euler qui fonde la théorie des graphes."},{"s":"Théorie des graphes","t":"Matrice d'adjacence","d":"matrice qui indique si deux sommets sont reliés."},{"s":"Théorie des graphes","t":"Algorithme de Dijkstra","d":"algorithme du plus court chemin dans un graphe pondéré."},{"s":"Théorie des graphes","t":"Graphe pondéré","d":"graphe dont les arêtes portent un poids."},{"s":"Théorie des graphes","t":"Réseau","d":"graphe orienté pondéré qui modélise des flux."},{"s":"Théorie des graphes","t":"Flot maximal","d":"plus grand débit qu'un réseau peut acheminer."},{"s":"Théorie des graphes","t":"Couplage","d":"ensemble d'arêtes sans sommet commun."},{"s":"Théorie des graphes","t":"Théorie de Ramsey","d":"étude de l'ordre inévitable dans de grandes structures."},{"s":"Théorie des graphes","t":"Tournoi","d":"graphe orienté complet où chaque paire de sommets est reliée par un arc."},{"s":"Topologie et analyse avancée","t":"Espace métrique","d":"ensemble muni d'une distance."},{"s":"Topologie et analyse avancée","t":"Distance","d":"fonction positive, symétrique, nulle seulement entre deux points confondus, qui vérifie l'inégalité triangulaire."},{"s":"Topologie et analyse avancée","t":"Norme (espace normé)","d":"longueur d'un vecteur vérifiant l'homogénéité et l'inégalité triangulaire."},{"s":"Topologie et analyse avancée","t":"Boule ouverte (fermée)","d":"ensemble des points à distance strictement inférieure (inférieure ou égale) à un rayon donné."},{"s":"Topologie et analyse avancée","t":"Ouvert","d":"partie qui est voisinage de chacun de ses points."},{"s":"Topologie et analyse avancée","t":"Fermé","d":"partie dont le complémentaire est ouvert."},{"s":"Topologie et analyse avancée","t":"Voisinage","d":"partie qui contient un ouvert contenant le point."},{"s":"Topologie et analyse avancée","t":"Adhérence","d":"plus petit fermé contenant une partie."},{"s":"Topologie et analyse avancée","t":"Intérieur","d":"plus grand ouvert contenu dans une partie."},{"s":"Topologie et analyse avancée","t":"Frontière","d":"adhérence privée de l'intérieur."},{"s":"Topologie et analyse avancée","t":"Partie dense","d":"partie dont l'adhérence est l'espace entier."},{"s":"Topologie et analyse avancée","t":"Compact","d":"partie fermée et bornée en dimension finie ; de toute suite on peut extraire une sous-suite convergente."},{"s":"Topologie et analyse avancée","t":"Connexe","d":"espace qui ne peut pas être coupé en deux ouverts disjoints non vides."},{"s":"Topologie et analyse avancée","t":"Connexe par arcs","d":"espace où deux points quelconques sont reliés par un chemin continu."},{"s":"Topologie et analyse avancée","t":"Espace complet","d":"espace métrique où toute suite de Cauchy converge."},{"s":"Topologie et analyse avancée","t":"Espace de Banach","d":"espace vectoriel normé complet."},{"s":"Topologie et analyse avancée","t":"Espace de Hilbert","d":"espace préhilbertien complet."},{"s":"Topologie et analyse avancée","t":"Convergence simple (uniforme)","d":"convergence en chaque point (avec un seuil valable pour tous les points)."},{"s":"Topologie et analyse avancée","t":"Convergence normale","d":"convergence de la série des bornes supérieures des termes."},{"s":"Topologie et analyse avancée","t":"T const key=e=>e.t+'§'+e.d.slice(0,40);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’]/g,"'").replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').replace(/[.;:]+$/,'').trim();
function answers(t){const a=[t],m=t.match(/^(.*?)\s*\((.*?)\)\s*$/);if(m)a.push(m[1],m[2]);return[...new Set(a.map(norm).filter(Boolean))]}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function check(inp,t){const x=norm(inp);if(!x)return 0;const A=answers(t);if(A.includes(x))return 2;return A.some(a=>a.length>=6&&lev(a,x)<=1)?1:0}
function sections(){return[...new Set(all().map(e=>e.s))]}
function fillSel(){const v=$('sec').value,s=sections();$('sec').innerHTML='';[['','Toutes les sections']].concat(s.map(x=>[x,x])).forEach(([a,b])=>{const o=document.createElement('option');o.value=a;o.textContent=b;$('sec').appendChild(o)});$('sec').value=s.includes(v)?v:'';$('sl').innerHTML='';s.forEach(x=>{const o=document.createElement('option');o.value=x;$('sl').appendChild(o)})}
function weight(e){const p=prog[key(e)];if(!p)return 2;return(p.last===0?3:1)/(1+p.r)+(p.r>=3?0:0.1)}
function next(){const v=$('sec').value,pool=all().filter(e=>!v||e.s===v);done=false;$('res').innerHTML='';$('ans').value='';
 if(!pool.length){cur=null;$('def').textContent='Aucune entrée dans cette sélection.';return}
 const c=pool.filter(e=>e!==cur),L=c.length?c:pool,w=L.map(weight);let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<L.length-1&&(r-=w[i])>0)i++;
 cur=L[i];$('cs').textContent=cur.s;$('def').textContent=cur.d;const auto=$('mode').value==='a';$('ans').style.display=auto?'none':'';$('go').textContent=auto?'Voir la réponse':'Valider';if(!auto)$('ans').focus();score()}
function score(){const t=sess.ok+sess.ko;$('score').textContent=t?`Session : ${sess.ok} / ${t} bonnes réponses`:''}
function rec(ok){const k=key(cur),p=prog[k]||{r:0,w:0,n:0};p.n++;if(ok){p.r++;p.last=1;sess.ok++}else{p.r=0;p.w++;p.last=0;sess.ko++}prog[k]=p;save();score()}
function btn(txt,fn,cls){const b=document.createElement('button');b.textContent=txt;b.onclick=fn;if(cls)b.className=cls;return b}
function reveal(msg,cls){const r=$('res');r.innerHTML='';const p=document.createElement('div');p.className=cls;p.textContent=msg;r.appendChild(p);const a=document.createElement('div');a.textContent='Réponse : '+cur.t;a.style.margin='6px 0';r.appendChild(a);return r}
function go(){if(!cur)return;if(done){next();return}
 if($('mode').value==='a'){done=true;const r=reveal('','m');r.firstChild.remove();const row=document.createElement('div');row.className='row';row.append(btn('Je savais',()=>{rec(true);next()},'pri'),btn('Je ne savais pas',()=>{rec(false);next()}));r.appendChild(row);return}
 const q=check($('ans').value,cur.t);done=true;
 if(q){rec(true);reveal(q===2?'Correct !':'Accepté (petite faute de frappe)','ok').appendChild(btn('Suivant',next,'pri'))}
 else{rec(false);const r=reveal('Raté','ko');const row=document.createElement('div');row.className='row';row.append(btn("J'avais bon",()=>{const p=prog[key(cur)];p.w=Math.max(0,p.w-1);p.r=1;p.last=1;sess.ko--;sess.ok++;save();next()}),btn('Suivant',next,'pri'));r.appendChild(row)}}
$('go').onclick=go;$('skip').onclick=()=>{if(cur&&!done)rec(false);next()};
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('sec').onchange=()=>{cur=null;next()};$('mode').onchange=next;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pg').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));if(b.dataset.p==='a')list();if(b.dataset.p==='s')stats()});
function list(){const u=$('ul');u.innerHTML='';if(!user.length){u.innerHTML='<li class="m">Aucun ajout pour l\'instant.</li>';return}
 user.forEach((e,i)=>{const li=document.createElement('li'),s=document.createElement('span');s.textContent=e.t+' — '+e.d;li.append(s,btn('✕',()=>{user.splice(i,1);save();fillSel();list()}));u.appendChild(li)})}
$('add').onclick=()=>{const t=$('nt').value.trim(),d=$('nd').value.trim();if(!t||!d){$('am').textContent='Terme et définition requis.';return}
 user.push({s:$('ns').value.trim()||'Mes ajouts',t,d});save();$('nt').value=$('nd').value='';fillSel();list();$('am').textContent='Ajouté ✓ ('+user.length+' ajouts)'};
$('imp').onclick=()=>{let s=$('ns').value.trim()||'Mes ajouts',n=0;$('bulk').value.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){s=l.replace(/^#+\s*/,'')||s;return}const i=l.indexOf('|');if(i<1)return;const t=l.slice(0,i).trim(),d=l.slice(i+1).trim();if(t&&d){user.push({s,t,d});n++}});
 save();fillSel();list();$('bm').textContent=n+' entrée(s) importée(s)';if(n)$('bulk').value=''};
function stats(){const a=all(),seen=a.filter(e=>prog[key(e)]).length,ma=a.filter(e=>(prog[key(e)]||{}).r>=3).length;$('st').innerHTML='';
 [`${a.length} entrées (dont ${user.length} ajoutées)`,`${seen} déjà vues, ${ma} bien maîtrisées (3 réussites d'affilée)`].forEach(x=>{const p=document.createElement('p');p.textContent=x;$('st').appendChild(p)})}
function exp(list){const g={};list.forEach(e=>(g[e.s]=g[e.s]||[]).push(e));const txt=Object.keys(g).map(s=>'# '+s+'\n'+g[s].map(e=>e.t+'|'+e.d).join('\n')).join('\n\n');$('ex').value=txt;
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='lexique_export.txt';a.click()}catch(e){}}
$('exu').onclick=()=>exp(user);$('exa').onclick=()=>exp(all());
$('rst').onclick=()=>{if(confirm('Remettre toute la progression à zéro ?')){prog={};sess={ok:0,ko:0};save();stats();next()}};
fillSel();next();
</script></body></html>
